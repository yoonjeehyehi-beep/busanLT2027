:root {
  /* 밤의 트리 앞에 놓인 우체통: 뒤에는 흐릿한 트리 조명, 앞에는 손글씨 편지지 */
  --night: #0d1c19;
  --night-2: #14302a;
  --cream: #fff8ea;
  --ink: #2b2620;
  --soft: rgba(255, 248, 234, .86);
  --red: #E23E2A;
  --red-dark: #b32a1a;
  --gold: #ffd84d;
  --green: #2f9a60;
  --line: #e2d8c2;
  --font: "Nanum Gothic", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --title: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --fs: 1;
}
* { box-sizing: border-box; }
html { font-size: calc(18px * var(--fs)); scroll-behavior: smooth; background: var(--night); }
html, body { margin: 0; }
body {
  color: var(--cream);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.6;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  background: radial-gradient(120% 90% at 50% 40%, var(--night-2) 0%, var(--night) 70%);
}
button, textarea, input { font-family: inherit; }
button { font-size: inherit; cursor: pointer; color: inherit; }

/* 뒤에 깔리는 흐릿한 트리 조명 */
#bokeh { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; filter: blur(16px); pointer-events: none; }
.lights, .wrap { position: relative; z-index: 1; }
.wrap { max-width: 980px; margin: 0 auto; padding: 8px 18px 96px; }

/* 위쪽 별 장식: 크기가 다른 별이 실에 매달려 하늘하늘 흔들린다 */
.lights {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  height: 124px;
  padding: 0 6px;
  overflow: hidden;
}
.bulb {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: 50% 0;
  filter: drop-shadow(0 0 7px rgba(255, 226, 120, .95)) drop-shadow(0 0 20px rgba(255, 200, 60, .55));
  animation: swing var(--t, 6s) ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
.bulb::before {
  content: "";
  width: 1px;
  height: var(--l, 20px);
  background: linear-gradient(rgba(255, 236, 170, .15), rgba(255, 236, 170, .6));
}
.bulb i {
  display: block;
  width: var(--s, 30px);
  height: var(--s, 30px);
  background: linear-gradient(160deg, #fffbe0 0%, #ffe27a 45%, #ffc93d 100%);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  animation: glow 3.4s ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
@keyframes glow {
  0%, 100% { opacity: 1; }
  50% { opacity: .62; }
}
@keyframes swing {
  0%, 100% { rotate: -7deg; }
  50% { rotate: 7deg; }
}
